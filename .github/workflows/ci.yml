name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Build and test matrix: {gcc, clang} x {-O0, -O2}
  # ---------------------------------------------------------------------------
  build-test:
    name: build-test / ${{ matrix.cc }} / ${{ matrix.opt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        opt: [-O0, -O2]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make ${{ matrix.cc }}
      - name: Build
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude ${{ matrix.opt }}" all
      - name: Test
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude ${{ matrix.opt }}" test
      - name: Parity
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude ${{ matrix.opt }}" parity

  # ---------------------------------------------------------------------------
  # Sanitizers: ASan + UBSan build, unit suite and spec smoke
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make ${{ matrix.cc }}
      - name: Sanitized build, tests and spec smoke
        run: make CC=${{ matrix.cc }} sanitizers

  # ---------------------------------------------------------------------------
  # Spec suite: fetch the official corpus (cached), run it, upload the
  # summary and fail only on a regression against the numeric baseline
  # in tests/spec/DEVIATIONS.md
  # ---------------------------------------------------------------------------
  spec-suite:
    name: spec suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y make gcc wabt
      - name: Cache the spec corpus
        id: spec-cache
        uses: actions/cache@v4
        with:
          path: |
            tests/spec/upstream
            tests/spec/json
          key: spec-corpus-${{ hashFiles('tools/fetch_spec_tests.sh') }}
      - name: Fetch the spec corpus
        if: steps.spec-cache.outputs.cache-hit != 'true'
        run: sh tools/fetch_spec_tests.sh
      - name: Run the spec suite and check the baseline
        run: make CC=gcc spec-summary
      - name: Upload the spec summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-summary
          path: build/spec_summary.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Size: the engine footprint must not grow by more than 5 %
  # ---------------------------------------------------------------------------
  size:
    name: static footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make gcc binutils
      - name: Measure the engine objects (-Os, freestanding)
        run: sh tools/size_measure.sh | tee build/size_measured.txt
      - name: Check against size_baseline.txt
        run: make CC=gcc size-check
      - name: Report the struct footprint
        run: make CC=gcc size-report

  # ---------------------------------------------------------------------------
  # Real-world modules: the committed clang output must run correctly
  # ---------------------------------------------------------------------------
  realworld:
    name: real-world modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make gcc clang lld wabt
      - name: Run the committed modules through the engine
        run: make CC=clang realworld-verify
      - name: Rebuild and compare against the native build
        run: make CC=clang realworld

  # ---------------------------------------------------------------------------
  # Invariants and fuzzing
  # ---------------------------------------------------------------------------
  no-alloc:
    name: zero dynamic allocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for allocation calls
        run: make no-alloc-check

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make gcc
      - name: Run deterministic fuzz smoke
        run: make CC=gcc fuzz-smoke SEED=42 ITER=200000

  fuzz-harness:
    name: fuzz harness (mutation driver, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make gcc clang
      - name: Deterministic mutation run under ASan+UBSan
        run: make CC=gcc fuzz-loop SEED=42 ITER=200000
      - name: Corpus mutation driver
        run: make CC=gcc fuzz-mutate MUT_ROUNDS=2

  # ---------------------------------------------------------------------------
  # Embedded target
  # ---------------------------------------------------------------------------
  cross-arm:
    name: Cortex-M4 cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        run: sudo apt-get update && sudo apt-get install -y make gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build library and embedded demo
        run: make CC=gcc PYTHON=python3 arm-cross
      - name: Check artifacts
        run: test -s build/arm/libwasm_engine.a && test -s build/arm/embedded_demo.elf

  embedded-check:
    name: embedded configuration (host build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and tools
        run: sudo apt-get update && sudo apt-get install -y make gcc
      - name: Build the Cortex-M configuration with the host compiler
        run: make CC=gcc embedded-check

  windows-mingw:
    name: windows / mingw-w64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            python
      - name: Build
        run: make OS= CC=gcc PYTHON=python
      - name: Test
        run: make OS= CC=gcc PYTHON=python test
      - name: Real-world modules (engine only)
        run: make OS= CC=gcc PYTHON=python realworld-verify
